---
version: 2.0.0
checks:
  disa:ubuntu2404-systemd:class:
    type: puppet-class-parameter
    settings:
      parameter: sicura::classes
      value:
      - systemd
    remediation:
      risk:
      - level: 41
        reason: The systemd class manages systemd-journald and purges unmanaged drop-in
          directories by default.
  disa:ubuntu2404-systemd:timezone:
    type: puppet-class-parameter
    settings:
      parameter: systemd::timezone
      value: Etc/UTC
    remediation:
      risk:
      - level: 21
  disa:ubuntu2404-systemd:unit_files.ctrl-alt-del.target:
    type: puppet-class-parameter
    settings:
      parameter: systemd::unit_files
      value:
        ctrl-alt-del.target:
          target: "/dev/null"
    remediation:
      risk:
      - level: 21
  disa:ubuntu2404-systemd:unit_files.kdump-tools.service:
    type: puppet-class-parameter
    settings:
      parameter: systemd::unit_files
      value:
        kdump-tools.service:
          target: "/dev/null"
    remediation:
      risk:
      - level: 21
        reason: Masks kdump-tools, disabling kernel crash dumps. Sites that need crash
          dumps must document the need with the ISSO and leave this check unenforced.
  disa:ubuntu2404-systemd:tmpfiles.zzz-systemd-stig.conf:
    type: puppet-class-parameter
    settings:
      parameter: systemd::tmpfiles
      value:
        zzz-systemd-stig.conf:
          content: |
            z /run/log/journal 2755 root systemd-journal - -
            Z /run/log/journal/%m ~2750 root systemd-journal - -
            z /var/log/journal 2755 root systemd-journal - -
            z /var/log/journal/%m 2755 root systemd-journal - -
            z /var/log/journal/%m/system.journal 0640 root systemd-journal - -
    remediation:
      risk:
      - level: 21
