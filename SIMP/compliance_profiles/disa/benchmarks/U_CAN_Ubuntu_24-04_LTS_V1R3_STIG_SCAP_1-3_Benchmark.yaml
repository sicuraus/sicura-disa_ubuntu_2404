      - CCI-000366
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270705r1066604_rule
    title: Ubuntu 24.04 LTS must be configured so that when passwords are changed
      or new passwords are established, pwquality must be used.
    description: Use of a complex password helps to increase the time and resources
      required to compromise the password. Password complexity, or strength, is a
      measure of the effectiveness of a password in resisting attempts at guessing
      and brute-force attacks. "pwquality" enforces complex password construction
      configuration and has the ability to limit brute-force attacks on the system.
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to use \"pwquality\" to enforce password
        complexity rules. \n \nAdd the following line to \"/etc/security/pwquality.conf\"
        (or modify the line to have the required value): \n \nenforcing = 1 \n \nAdd
        the following line to \"/etc/pam.d/common-password\" (or modify the line to
        have the required value): \n \npassword requisite pam_pwquality.so retry=3
        \n \nNote: Ensure the value of \"retry\" is between \"1\" and \"3\"."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270706:def:1:
