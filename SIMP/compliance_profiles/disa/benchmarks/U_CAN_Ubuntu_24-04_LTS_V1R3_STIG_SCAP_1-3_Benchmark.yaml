    title: Ubuntu 24.04 LTS must enforce a delay of at least four seconds between
      logon prompts following a failed logon attempt.
    description: |-
      Limiting the number of logon attempts over a certain time interval reduces the chances that an unauthorized user may gain access to an account.

      The delay option is set in microseconds.
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to enforce a delay of at least four seconds
        between logon prompts following a failed logon attempt. \n \nEdit the file
        \"/etc/pam.d/common-auth\" and set the parameter \"pam_faildelay\" to a value
        of \"4000000\" or greater: \n \nauth    required    pam_faildelay.so    delay=4000000"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
