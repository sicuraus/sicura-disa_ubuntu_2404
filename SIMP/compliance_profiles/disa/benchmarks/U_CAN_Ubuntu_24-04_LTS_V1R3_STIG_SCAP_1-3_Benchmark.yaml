    title: Ubuntu 24.04 LTS must be configured such that Pluggable Authentication
      Module (PAM) prohibits the use of cached authentications after one day.
    description: If cached authentication information is out-of-date, the validity
      of the authentication information may be questionable.
    imported_data:
      fixtext: "Configure PAM to prohibit the use of cached authentications after
        one day. Add or change the following line in \"/etc/sssd/sssd.conf\" just
        below the line \"[pam]\": \n \noffline_credentials_expiration = 1 \n \nNote:
        It is valid for this configuration to be in a file with a name that ends with
        \".conf\" and does not begin with a \".\" in the \"/etc/sssd/conf.d/\" directory
        instead of the \"/etc/sssd/sssd.conf\" file."
