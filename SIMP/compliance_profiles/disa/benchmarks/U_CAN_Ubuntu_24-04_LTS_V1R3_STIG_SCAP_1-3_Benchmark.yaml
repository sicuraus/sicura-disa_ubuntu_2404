    title: Ubuntu 24.04 LTS must be configured so that the audit log directory is
      not write-accessible by unauthorized users.
    description: "If audit information were to become compromised, then forensic analysis
      and discovery of the true source of potentially malicious system activity is
      impossible to achieve. \n \nTo ensure the veracity of audit information, Ubuntu
      24.04 LTS must protect audit information from unauthorized deletion. This requirement
      can be achieved through multiple methods, which will depend upon system architecture
      and design. \n \nAudit information includes all information (e.g., audit records,
      audit settings, audit reports) needed to successfully audit information system
      activity."
    imported_data:
      fixtext: "Configure the audit log directory to have a mode of \"0750\" or less
        permissive. \n \nDetermine where the audit logs are stored with the following
        command: \n \n$ sudo grep -iw ^log_file /etc/audit/auditd.conf \n\nlog_file
        = /var/log/audit/audit.log \n \nUsing the path of the directory containing
        the audit logs, configure the audit log directory to have a mode of \"0750\"
        or less permissive by using the following command: \n \n$ sudo chmod -R  750
        /var/log/audit"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270831:def:1:
    controls:
      SRG-OS-000278-GPOS-00108: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270831: true
      cci:CCI-001496: true
      AU-9(3): true
    identifiers:
      disa:
      - SRG-OS-000278-GPOS-00108
      - V-270831
      - AU-9(3)
      - CCI-001496
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270831r1135002_rule
    title: Ubuntu 24.04 LTS must use cryptographic mechanisms to protect the integrity
      of audit tools.
    description: "Protecting the integrity of the tools used for auditing purposes
      is a critical step toward ensuring the integrity of audit information. Audit
      information includes all information (e.g., audit records, audit settings, and
      audit reports) needed to successfully audit information system activity. \n
      \nAudit tools include, but are not limited to, vendor-provided and open source
      audit tools needed to successfully view and manipulate audit information system
      activity and records. Audit tools include custom queries and report generators.
      \n \nIt is not uncommon for attackers to replace the audit tools or inject code
      into the existing tools with the purpose of providing the capability to hide
      or erase system activity from the audit logs. \n \nTo address this risk, audit
      tools must be cryptographically signed to provide the capability to identify
      when the audit tools have been modified, manipulated, or replaced. An example
      is a checksum hash of the file or files."
    imported_data:
      fixtext: "Add or update the following selection lines for \"/etc/aide/aide.conf\"
        to protect the integrity of the audit tools: \n \n# Audit Tools \n/sbin/auditctl
        p+i+n+u+g+s+b+acl+xattrs+sha512 \n/sbin/auditd p+i+n+u+g+s+b+acl+xattrs+sha512
        \n/sbin/ausearch p+i+n+u+g+s+b+acl+xattrs+sha512 \n/sbin/aureport p+i+n+u+g+s+b+acl+xattrs+sha512
        \n/sbin/autrace p+i+n+u+g+s+b+acl+xattrs+sha512 \n/sbin/augenrules p+i+n+u+g+s+b+acl+xattrs+sha512"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270832:def:1:
    controls:
      SRG-OS-000058-GPOS-00028: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270832: true
      cci:CCI-000163: true
      AU-9: true
    identifiers:
      disa:
      - SRG-OS-000058-GPOS-00028
      - V-270832
      - AU-9
      - CCI-000163
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270832r1068399_rule
    title: Ubuntu 24.04 LTS audit system must protect auditing rules from unauthorized
      change.
    description: Unauthorized disclosure of audit records can reveal system and configuration
      data to attackers, thus compromising its confidentiality. Audit information
      includes all information (e.g., audit records, audit settings, audit reports)
      needed to successfully audit Ubuntu 24.04 LTS system activity. In immutable
      mode, unauthorized users cannot execute changes to the audit system to potentially
      hide malicious activity and then put the audit rules back. A system reboot would
      be noticeable, and a system administrator could then investigate the unauthorized
      changes.
    imported_data:
      fixtext: |-
        Configure the audit system to set the audit rules to be immutable by adding the following line to the end of "/etc/audit/rules.d/audit.rules":

        -e 2
    confine:
      os.release.major:
      - '24.04'
