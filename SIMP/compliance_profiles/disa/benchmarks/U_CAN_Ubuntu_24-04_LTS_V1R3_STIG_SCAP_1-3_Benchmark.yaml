    title: Ubuntu 24.04 LTS must configure audit tools with a mode of "0755" or less
      permissive.
    description: "Protecting audit information also includes identifying and protecting
      the tools used to view and manipulate log data. Therefore, protecting audit
      tools is necessary to prevent unauthorized operation on audit information. \n
      \nOperating systems providing tools to interface with audit information will
      leverage user permissions, roles identifying the user accessing the tools, and
      the corresponding user rights to make decisions regarding access to audit tools.
      \n \nAudit tools include, but are not limited to, vendor-provided and open source
      audit tools needed to successfully view and manipulate audit information system
      activity and records. Audit tools include custom queries and report generators.\n\nSatisfies:
      SRG-OS-000257-GPOS-00098, SRG-OS-000256-GPOS-00097"
    imported_data:
      fixtext: "Configure the audit tools on Ubuntu 24.04 LTS to be protected from
        unauthorized access by setting the correct permissive mode using the following
        command: \n \n$ sudo chmod 0755 [audit_tool] \n \nReplace \"[audit_tool]\"
        with the audit tool that does not have the correct permissions."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
