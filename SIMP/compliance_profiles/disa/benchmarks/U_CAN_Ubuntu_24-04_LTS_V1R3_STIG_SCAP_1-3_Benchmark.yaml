    title: Ubuntu 24.04 LTS must prevent the use of dictionary words for passwords.
    description: Password-based authentication applies to passwords regardless of
      whether they are used in single-factor or multifactor authentication. Long passwords
      or passphrases are preferable over shorter passwords. Enforced composition rules
      provide marginal security benefits while decreasing usability. However, organizations
      may choose to establish certain rules for password generation (e.g., minimum
      character length for long passwords) under certain circumstances and can enforce
      this requirement in IA-5(1)(h). Account recovery can occur, for example, in
      situations when a password is forgotten. Cryptographically protected passwords
      include salted one-way cryptographic hashes of passwords. The list of commonly
      used, compromised, or expected passwords includes passwords obtained from previous
      breach corpuses, dictionary words, and repetitive or sequential characters.
      The list includes context-specific words, such as the name of the service, username,
      and derivatives thereof.
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to prevent the use of dictionary words
        for passwords. \n \nAdd or update the following line in the \"/etc/security/pwquality.conf\"
        file to include the \"dictcheck=1\" parameter: \n \ndictcheck=1"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270705:def:1:
    controls:
