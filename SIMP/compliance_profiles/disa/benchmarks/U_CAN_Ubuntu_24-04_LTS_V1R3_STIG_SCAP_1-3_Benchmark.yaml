    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270728r1066673_rule
    title: Ubuntu 24.04 LTS must enforce password complexity by requiring that at
      least one numeric character be used.
    description: "Use of a complex password helps to increase the time and resources
      required to compromise the password. Password complexity, or strength, is a
      measure of the effectiveness of a password in resisting attempts at guessing
      and brute-force attacks. \n \nPassword complexity is one factor of several that
      determines how long it takes to crack a password. The more complex the password,
      the greater the number of possible combinations that need to be tested before
      the password is compromised.\n\nSatisfies: SRG-OS-000071-GPOS-00039, SRG-OS-000730-GPOS-00190"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to enforce password complexity by requiring
        that at least one numeric character be used. \n \nAdd or update the \"/etc/security/pwquality.conf\"
        file to contain the \"dcredit\" parameter: \n \ndcredit=-1"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270729:def:1:
    controls:
      SRG-OS-000072-GPOS-00040: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270729: true
      cci:CCI-004065: true
      IA-5(1): true
      cci:CCI-004066: true
    identifiers:
      disa:
      - SRG-OS-000072-GPOS-00040
      - V-270729
      - IA-5(1)
      - CCI-004065
      - CCI-004066
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270729r1066676_rule
    title: Ubuntu 24.04 LTS must require the change of at least eight characters when
      passwords are changed.
    description: "If Ubuntu 24.04 LTS allows the user to consecutively reuse extensive
      portions of passwords, this increases the chances of password compromise by
      increasing the window of opportunity for attempts at guessing and brute-force
      attacks. \n \nThe number of changed characters refers to the number of changes
      required with respect to the total number of positions in the current password.
      In other words, characters may be the same within the two passwords; however,
      the positions of the like characters must be different. \n \nIf the password
      length is an odd number, then number of changed characters must be rounded up.
      For example, a password length of 15 characters must require the change of at
      least eight characters.\n\nSatisfies: SRG-OS-000072-GPOS-00040, SRG-OS-000730-GPOS-00190"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to require the change of at least eight
        characters when passwords are changed. \n \nAdd or update the \"/etc/security/pwquality.conf\"
        file to include the \"difok=8\" parameter: \n \ndifok=8"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270730:def:1:
    controls:
      SRG-OS-000075-GPOS-00043: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270730: true
      cci:CCI-004065: true
      IA-5(1): true
