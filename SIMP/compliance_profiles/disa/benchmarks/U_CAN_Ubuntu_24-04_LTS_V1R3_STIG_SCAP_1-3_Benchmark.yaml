    title: Ubuntu 24.04 LTS must electronically verify Personal Identity Verification
      (PIV) credentials.
    description: "The use of PIV credentials facilitates standardization and reduces
      the risk of unauthorized access. \n \nDOD has mandated the use of the common
      access card (CAC) to support identity management and personal authentication
      for systems covered under Homeland Security Presidential Directive (HSPD) 12,
      as well as making the CAC a primary component of layered protection for national
      security systems."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to do certificate status checking for multifactor
        authentication. \n \nModify all of the \"cert_policy\" lines in \"/etc/pam_pkcs11/pam_pkcs11.conf\"
        to include \"ocsp_on\"."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270724:def:1:
    controls:
      SRG-OS-000109-GPOS-00056: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270724: true
      cci:CCI-004045: true
