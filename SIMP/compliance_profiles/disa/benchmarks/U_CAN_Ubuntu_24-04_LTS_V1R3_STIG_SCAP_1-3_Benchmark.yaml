    title: Ubuntu 24.04 LTS must audit any script or executable called by cron as
      root or by any privileged user.
    description: Any script or executable called by cron as root or by any privileged
      user must be owned by that user, must have the permissions 755 or more restrictive,
      and should have no extended rights that allow any nonprivileged user to modify
      the script or executable.
    imported_data:
      fixtext: |-
        Configure Ubuntu 24.04 LTS to audit the execution of any system call made by cron as root or as any privileged user.

        Add or update the following file system rules to "/etc/audit/rules.d/audit.rules":
        -w /etc/cron.d/ -p wa -k cronjobs
        -w /var/spool/cron/ -p wa -k cronjobs

        To load the rules to the kernel immediately, use the following command:

        $ sudo augenrules --load
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
