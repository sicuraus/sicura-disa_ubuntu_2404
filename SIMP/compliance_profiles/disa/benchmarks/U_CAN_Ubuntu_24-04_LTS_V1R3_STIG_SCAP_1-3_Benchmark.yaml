    title: Ubuntu 24.04 LTS must require users to reauthenticate for privilege escalation
      or when changing roles.
    description: "Without reauthentication, users may access resources or perform
      tasks for which they do not have authorization.\n \nWhen operating systems provide
      the capability to escalate a functional capability, it is critical the user
      reauthenticate."
    imported_data:
