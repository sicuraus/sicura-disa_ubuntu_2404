    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270732r1066685_rule
    title: Ubuntu 24.04 LTS must enforce a minimum 15-character password length.
    description: "The shorter the password, the lower the number of possible combinations
      that need to be tested before the password is compromised. \n \nPassword complexity,
      or strength, is a measure of the effectiveness of a password in resisting attempts
      at guessing and brute-force attacks. Password length is one factor of several
      that helps to determine strength and how long it takes to crack a password.
      Use of more characters in a password helps to exponentially increase the time
      and/or resources required to compromise the password.\n\nSatisfies: SRG-OS-000078-GPOS-00046,
      SRG-OS-000730-GPOS-00190"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to enforce a minimum 15-character password
        length. \n \nAdd or modify the \"minlen\" parameter value to the \"/etc/security/pwquality.conf\"
        file: \n \nminlen=15"
    confine:
