    title: Ubuntu 24.04 LTS default filesystem permissions must be defined in such
      a way that all authenticated users can read and modify only their own files.
    description: Setting the most restrictive default permissions ensures that when
      new accounts are created, they do not have unnecessary access.
    imported_data:
      fixtext: "Configure the system to define the default permissions for all authenticated
        users in such a way that the user can read and modify only their own files.
        \n \nEdit the \"UMASK\" parameter in the \"/etc/login.defs\" file to match
        the example below: \n \nUMASK 077"
