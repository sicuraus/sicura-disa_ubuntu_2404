      - V-270749
      - SC-4
      - CCI-001090
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270749r1137695_rule
    title: Ubuntu 24.04 LTS must restrict access to the kernel message buffer.
    description: Restricting access to the kernel message buffer limits access only
      to root. This prevents attackers from gaining additional system information
      as a nonprivileged user.
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to restrict access to the kernel message
        buffer.\n\nSet the system to the required kernel parameter by adding or modifying
        the following line in /etc/sysctl.conf or a config file in the /etc/sysctl.d/
        directory:\n\n     kernel.dmesg_restrict = 1\n\nRemove any configurations
        that conflict with the above from the following locations: \n     /run/sysctl.d/\n
        \    /etc/sysctl.d/\n     /usr/local/lib/sysctl.d/\n     /usr/lib/sysctl.d/\n
        \    /lib/sysctl.d/\n     /etc/sysctl.conf\n\nReload settings from all system
        configuration files with the following command:\n\n     $ sudo sysctl --system"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270753:def:1:
