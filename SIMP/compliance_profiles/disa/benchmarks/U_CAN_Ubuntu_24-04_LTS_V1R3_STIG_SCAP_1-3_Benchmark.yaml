    title: Ubuntu 24.04 LTS must disable account identifiers (individuals, groups,
      roles, and devices) after 35 days of inactivity.
    description: "Inactive identifiers pose a risk to systems and applications because
      attackers may exploit an inactive identifier and potentially obtain undetected
      access to the system. Owners of inactive accounts will not notice if unauthorized
      access to their user account has been obtained. \n \nOperating systems need
      to track periods of inactivity and disable application identifiers after 35
      days of inactivity.\n\nSatisfies: SRG-OS-000118-GPOS-00060, SRG-OS-000590-GPOS-00110"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to disable account identifiers after 35
        days of inactivity after the password expiration.  \n \nRun the following
        command to change the configuration for adduser: \n \n$ sudo useradd -D -f
        35 \n \nNote: DOD recommendation is 35 days, but a lower value is acceptable.
        The value \"0\" will disable the account immediately after the password expires."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
