    title: Ubuntu 24.04 LTS must limit the number of concurrent sessions to 10 for
      all accounts and/or account types.
    description: "Ubuntu 24.04 LTS management includes the ability to control the
      number of users and user sessions that utilize an operating system. Limiting
      the number of allowed users and sessions per user is helpful in reducing the
      risks related to denial-of-service (DoS) attacks. \n \nThis requirement addresses
      concurrent sessions for information system accounts and does not address concurrent
      sessions by single users via multiple system accounts. The maximum number of
      concurrent sessions must be defined based upon mission needs and the operational
      environment for each system."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to limit the number of concurrent sessions
        to 10 for all accounts and/or account types. \n \nAdd the following line to
        the top of the /etc/security/limits.conf or in a \".conf\" file defined in
        /etc/security/limits.d/: \n \n* hard maxlogins 10"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270680:def:1:
    controls:
      SRG-OS-000279-GPOS-00109: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270680: true
      cci:CCI-002361: true
