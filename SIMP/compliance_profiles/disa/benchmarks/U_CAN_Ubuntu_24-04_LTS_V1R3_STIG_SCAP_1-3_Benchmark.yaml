      disa:Ubuntu24.04:v001.003:V-270737: true
      cci:CCI-000185: true
      IA-5(2)(1): true
      cci:CCI-004909: true
      SC-17: true
    identifiers:
      disa:
      - SRG-OS-000066-GPOS-00034
      - V-270737
      - IA-5(2)(1)
      - CCI-000185
      - SC-17
      - CCI-004909
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270737r1067178_rule
    title: Ubuntu 24.04 LTS, for PKI-based authentication, Privileged Access Management
      (PAM) must validate certificates by constructing a certification path (which
      includes status information) to an accepted trust anchor.
    description: "Without path validation, an informed trust decision by the relying
      party cannot be made when presented with any certificate not already explicitly
      trusted. \n \nA trust anchor is an authoritative entity represented via a public
      key and associated data. It is used in the context of public key infrastructures,
      X.509 digital certificates, and DNSSEC. \n \nWhen there is a chain of trust,
      usually the top entity to be trusted becomes the trust anchor; it can be, for
      example, a certification authority (CA). A certification path starts with the
      subject certificate and proceeds through a number of intermediate certificates
      up to a trusted root certificate, typically issued by a trusted CA. \n \nThis
      requirement verifies that a certification path to an accepted trust anchor is
      used for certificate validation and that the path includes status information.
      Path validation is necessary for a relying party to make an informed trust decision
      when presented with any certificate not already explicitly trusted. Status information
      for certification paths includes certificate revocation lists or online certificate
      status protocol responses. Validation of the certificate status information
      is out of scope for this requirement.\n\nSatisfies: SRG-OS-000066-GPOS-00034,
      SRG-OS-000775-GPOS-00230"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS, for PKI-based authentication, to validate
        certificates by constructing a certification path to an accepted trust anchor.
        \n \nDetermine which pkcs11 module is being used via the \"use_pkcs11_module\"
        in \"/etc/pam_pkcs11/pam_pkcs11.conf\" and ensure \"ca\" is enabled in \"cert_policy\".
        \n \nAdd or update the \"cert_policy\" to ensure \"ca\" is enabled: \n \ncert_policy
        = ca,signature,ocsp_on; \n \nIf the system is missing an \"/etc/pam_pkcs11/\"
        directory and an \"/etc/pam_pkcs11/pam_pkcs11.conf\", find an example to copy
        into place and modify accordingly at \"https://manpages.ubuntu.com/manpages/xenial/man8/pam_pkcs11.8.html\"."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270738:def:1:
    controls:
      SRG-OS-000384-GPOS-00167: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270738: true
      cci:CCI-004068: true
      IA-5(2)(2): true
    identifiers:
      disa:
      - SRG-OS-000384-GPOS-00167
      - V-270738
      - IA-5(2)(2)
      - CCI-004068
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270738r1066703_rule
    title: Ubuntu 24.04 LTS for PKI-based authentication, must implement a local cache
      of revocation data in case of the inability to access revocation information
      via the network.
    description: Without configuring a local cache of revocation data, there is the
      potential to allow access to users who are no longer authorized (users with
      revoked certificates).
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS, for PKI-based authentication, to use local
        revocation data when unable to access the network to obtain it remotely. \n
        \nAdd or update the \"cert_policy\" option in \"/etc/pam_pkcs11/pam_pkcs11.conf\"
        to include \"crl_auto\" or \"crl_offline\". \n \ncert_policy = ca,signature,ocsp_on,
        crl_auto; \n \nIf the system is missing an \"/etc/pam_pkcs11/\" directory
        and an \"/etc/pam_pkcs11/pam_pkcs11.conf\", find an example to copy into place
        and modify accordingly at \"/usr/share/doc/libpam-pkcs11/examples/pam_pkcs11.conf.example.gz\"."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270739:def:1:
    controls:
      SRG-OS-000120-GPOS-00061: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270739: true
      cci:CCI-000803: true
