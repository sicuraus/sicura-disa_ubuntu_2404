      - SI-11
      - CCI-001312
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270757r1066760_rule
    title: Ubuntu 24.04 LTS must generate system journal entries without revealing
      information that could be exploited by adversaries.
    description: "Any operating system providing too much information in error messages
      risks compromising the data and security of the structure, and content of error
      messages must be carefully considered by the organization. \n \nOrganizations
      carefully consider the structure/content of error messages. The extent to which
      information systems are able to identify and handle error conditions is guided
      by organizational policy and operational requirements. Information that could
      be exploited by adversaries includes, for example, erroneous logon attempts
      with passwords entered by mistake as the username, mission/business information
      that can be derived from (if not stated explicitly by) information recorded,
      and personal information, such as account numbers, social security numbers,
      and credit card numbers."
    imported_data:
      fixtext: |-
        Configure the system to set the appropriate permissions to the files and directories used by the systemd journal:

        $ sudo nano /usr/lib/tmpfiles.d/systemd.conf

        Edit the following lines of the configuration file:

        z /run/log/journal 2640 root systemd-journal - -
        Z /run/log/journal/%m ~2640 root systemd-journal - -
        z /var/log/journal 2640 root systemd-journal - -
        z /var/log/journal/%m 2640 root systemd-journal - -
        z /var/log/journal/%m/system.journal 0640 root systemd-journal - -

        Note: The system must be restarted for these settings to take effect.
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
