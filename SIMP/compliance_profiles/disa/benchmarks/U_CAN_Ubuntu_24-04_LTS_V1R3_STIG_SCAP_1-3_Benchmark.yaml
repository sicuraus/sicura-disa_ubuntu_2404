ce:
  oval:sicura.disa.001.003.Ubuntu24.04.V-270645:def:1:
    controls:
      SRG-OS-000480-GPOS-00227: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270645: true
      cci:CCI-000366: true
      CM-6: true
    identifiers:
      disa:
      - SRG-OS-000480-GPOS-00227
      - V-270645
      - CM-6
      - CCI-000366
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270645r1068357_rule
    title: Ubuntu 24.04 LTS must not have the "systemd-timesyncd" package installed.
    description: "Inaccurate time stamps make it more difficult to correlate events
      and can lead to an inaccurate analysis. Determining the correct time a particular
      event occurred on a system is critical when conducting forensic analysis and
      investigating system events. Sources outside the configured acceptable allowance
      (drift) may be inaccurate. \n\nOrganizations must consider endpoints that may
      not have regular access to the authoritative time server (e.g., mobile, teleworking,
      and tactical endpoints)."
    imported_data:
      fixtext: |-
        The "systemd-timesyncd" package will be uninstalled as part of the "chrony" package install. Purge the remaining configuration files for "systemd-timesyncd" from Ubuntu 24.04 LTS:

        $ sudo apt-get purge systemd-timesyncd
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270646:def:1:
    controls:
      SRG-OS-000480-GPOS-00227: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270646: true
      cci:CCI-000366: true
      CM-6: true
    identifiers:
      disa:
      - SRG-OS-000480-GPOS-00227
      - V-270646
      - CM-6
      - CCI-000366
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270646r1068358_rule
    title: Ubuntu 24.04 LTS must not have the "ntp" package installed.
    description: "Inaccurate time stamps make it more difficult to correlate events
      and can lead to an inaccurate analysis. Determining the correct time a particular
      event occurred on a system is critical when conducting forensic analysis and
      investigating system events. Sources outside the configured acceptable allowance
      (drift) may be inaccurate. \n\nOrganizations must consider endpoints that may
      not have regular access to the authoritative time server (e.g., mobile, teleworking,
      and tactical endpoints)."
    imported_data:
      fixtext: |-
        Uninstall the "ntp" package using the following command:

        $ sudo apt remove ntp

        If there are additional configuration files on the system that must be removed, the following command can be used instead:

        $ sudo apt-get purge ntp
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270647:def:1:
    controls:
      SRG-OS-000074-GPOS-00042: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270647: true
      cci:CCI-000197: true
      IA-5(1): true
    identifiers:
      disa:
      - SRG-OS-000074-GPOS-00042
      - V-270647
      - IA-5(1)
      - CCI-000197
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270647r1066430_rule
    title: Ubuntu 24.04 LTS must not have the telnet package installed.
    description: "Remote access services, such as those providing remote access to
      network devices and information systems, which lack automated control capabilities,
      increase risk and make remote user access management difficult at best. \n \nRemote
      access is access to DOD nonpublic information systems by an authorized user
      (or an information system) communicating through an external, nonorganization-controlled
      network. Remote access methods include, for example, dial-up, broadband, and
      wireless. \n \nUbuntu 24.04 LTS functionality (e.g., RDP) must be capable of
      taking enforcement action if the audit reveals unauthorized activity. Automated
      control of remote access sessions allows organizations to ensure ongoing compliance
      with remote access policies by enforcing connection rules of remote access applications
      on a variety of information system components (e.g., servers, workstations,
      notebook computers, smartphones, and tablets)."
    imported_data:
      fixtext: "Remove the telnet package from Ubuntu 24.04 LTS with the following
        command: \n \n$ sudo apt remove telnetd"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270648:def:1:
    controls:
      SRG-OS-000095-GPOS-00049: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270648: true
      cci:CCI-000381: true
      CM-7: true
    identifiers:
      disa:
      - SRG-OS-000095-GPOS-00049
      - V-270648
      - CM-7
      - CCI-000381
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270648r1066433_rule
    title: Ubuntu 24.04 LTS must not have the rsh-server package installed.
    description: "It is detrimental for operating systems to provide, or install by
      default, functionality exceeding requirements or mission objectives. These unnecessary
      capabilities or services are often overlooked and therefore, may remain unsecured.
      They increase the risk to the platform by providing additional attack vectors.
      \n \nOperating systems are capable of providing a wide variety of functions
      and services. Some of the functions and services, provided by default, may not
      be necessary to support essential organizational operations (e.g., key missions,
      functions). \n \nExamples of nonessential capabilities include, but are not
      limited to, games, software packages, tools, and demonstration software, not
      related to requirements or providing a wide array of functionality not required
      for every mission, but which cannot be disabled."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to disable nonessential capabilities by
        removing the rsh-server package from the system with the following command:
        \n \n$ sudo apt remove rsh-server"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270649:def:1:
    controls:
      SRG-OS-000445-GPOS-00199: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270649: true
      cci:CCI-002696: true
      SI-6: true
    identifiers:
      disa:
      - SRG-OS-000445-GPOS-00199
      - V-270649
      - SI-6
      - CCI-002696
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270649r1067136_rule
    title: Ubuntu 24.04 LTS must use a file integrity tool to verify correct operation
      of all security functions.
    description: "Without verification, security functions may not operate correctly
      and the failure may go unnoticed. Security function is defined as the hardware,
      software, and/or firmware of the information system responsible for enforcing
      the system security policy and supporting the isolation of code and data on
      which the protection is based. Security functionality includes, but is not limited
      to, establishing system accounts, configuring access authorizations (i.e., permissions,
      privileges), setting events to be audited, and setting intrusion detection parameters.
      \n \nThis requirement applies to Ubuntu 24.04 LTS performing security function
      verification/testing and/or systems and environments that require this functionality."
    imported_data:
      fixtext: |-
        Install the "AIDE" file integrity package:

        $ sudo apt install -y aide
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
