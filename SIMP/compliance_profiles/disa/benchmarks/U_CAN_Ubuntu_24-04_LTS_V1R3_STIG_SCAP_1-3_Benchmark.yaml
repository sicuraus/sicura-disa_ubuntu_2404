    title: Ubuntu 24.04 LTS must configure the SSH daemon to use FIPS 140-3 approved
      ciphers to prevent the unauthorized disclosure of information and/or detect
      changes to information during transmission.
    description: "Without cryptographic integrity protections, information can be
      altered by unauthorized users without detection.  \n \nRemote access (e.g.,
      RDP) is access to DOD nonpublic information systems by an authorized user (or
      an information system) communicating through an external, nonorganization-controlled
      network. Remote access methods include, for example, dial-up, broadband, and
      wireless.  \n \nNonlocal maintenance and diagnostic activities are those activities
      conducted by individuals communicating through a network, either an external
      network (e.g., the internet) or an internal network.  \n \nLocal maintenance
      and diagnostic activities are those activities carried out by individuals physically
      present at the information system or information system component and not communicating
      across a network connection.  \n \nEncrypting information for transmission protects
      information from unauthorized disclosure and modification. Cryptographic mechanisms
      implemented to protect information integrity include, for example, cryptographic
      hash functions that have common application in digital signatures, checksums,
      and message authentication codes.\n\nSatisfies: SRG-OS-000033-GPOS-00014, SRG-OS-000394-GPOS-00174,
      SRG-OS-000424-GPOS-00188"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to allow the SSH daemon to only implement
        FIPS-approved algorithms. \n \nAdd the following line (or modify the line
        to have the required value) to the \"/etc/ssh/sshd_config\" file (this file
        may be named differently or be in a different location if using a version
        of SSH that is provided by a third-party vendor): \n \nCiphers aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes128-ctr\n
        \nRestart the \"sshd\" service for changes to take effect: \n \n$ sudo systemctl
        restart sshd"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
