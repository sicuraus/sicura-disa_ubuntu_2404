    title: Ubuntu 24.04 LTS must disable automatic mounting of Universal Serial Bus
      (USB) mass storage driver.
    description: |-
      Without authenticating devices, unidentified or unknown devices may be introduced, thereby facilitating malicious activity.

      Peripherals include, but are not limited to, devices such as flash drives, external storage, and printers.

      Satisfies: SRG-OS-000690-GPOS-00140, SRG-OS-000378-GPOS-00163
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to disable using the USB storage kernel
        module with the following command: \n\n$ sudo su -c \"echo install usb-storage
        /bin/false >> /etc/modprobe.d/DISASTIG.conf\"\n\nConfigure Ubuntu 24.04 LTS
        to disable the ability to use USB mass storage devices with the following
        command:\n\n$ sudo su -c \"echo blacklist usb-storage >> /etc/modprobe.d/DISASTIG.conf\""
    confine:
