    description: "Use of a complex password helps to increase the time and resources
      required to compromise the password. Password complexity or strength is a measure
      of the effectiveness of a password in resisting attempts at guessing and brute-force
      attacks. \n \nPassword complexity is one factor in determining how long it takes
      to crack a password. The more complex the password, the greater the number of
      possible combinations that need to be tested before the password is compromised.
      \n \nSpecial characters are those characters that are not alphanumeric. Examples
      include: ~ ! @ # $ % ^ *.\n\nSatisfies: SRG-OS-000266-GPOS-00101, SRG-OS-000730-GPOS-00190"
    imported_data:
