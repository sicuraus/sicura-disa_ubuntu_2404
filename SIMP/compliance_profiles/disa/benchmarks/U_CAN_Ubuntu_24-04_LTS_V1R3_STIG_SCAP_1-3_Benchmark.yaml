    title: Ubuntu 24.04 LTS must store only encrypted representations of passwords.
    description: Password complexity, or strength, is a measure of the effectiveness
      of a password in resisting attempts at guessing and brute-force attacks. If
      the information system or application allows the user to consecutively reuse
      their password when that password has exceeded its defined lifetime, the end
      result is a password that is not changed per policy requirements.
    imported_data:
      fixtext: |-
        Configure Ubuntu 24.04 LTS to store encrypted representations of passwords.

        Add or modify the "sha512" parameter value to the following line in "/etc/pam.d/common-password" file:

        password [success=1 default=ignore] pam_unix.so obscure sha512 shadow rounds=100000
    confine:
      os.release.major:
