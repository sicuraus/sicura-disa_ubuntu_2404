    title: Ubuntu 24.04 LTS must not have accounts configured with blank or null passwords.
    description: If an account has an empty password, anyone could log on and run
      commands with the privileges of that account. Accounts with empty passwords
      must never be used in operational environments.
    imported_data:
      fixtext: |-
        Configure all accounts on the system to have a password or lock the account with the following commands:

        Perform a password reset:
