    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270724r1066661_rule
    title: Ubuntu 24.04 LTS must prevent direct login to the root account.
    description: "To ensure individual accountability and prevent unauthorized access,
      organizational users must be individually identified and authenticated. \n \nA
      group authenticator is a generic account used by multiple individuals. Use of
      a group authenticator alone does not uniquely identify individual users. Examples
      of the group authenticator are the Unix OS \"root\" user account, the Windows
      \"Administrator\" account, the \"sa\" account, or a \"helpdesk\" account. \n
      \nFor example, the Unix and Windows operating systems offer a \"switch user\"
      capability allowing users to authenticate with their individual credentials
      and, when needed, switch to the administrator role. This method provides for
      unique individual authentication prior to using a group authenticator. \n \nUsers
      (and any processes acting on behalf of users) need to be uniquely identified
      and authenticated for all accesses other than those accesses explicitly identified
      and documented by the organization, which outlines specific user actions that
      can be performed on Ubuntu 24.04 LTS without identification or authentication.
      \n \nRequiring individuals to be authenticated with an individual authenticator
      prior to using a group authenticator allows for traceability of actions, as
      well as adding an additional level of protection of the actions that can be
      taken with group account knowledge."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to prevent direct logins to the root account
        by performing the following operations: \n \n$ sudo passwd -l root"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270725:def:1:
