    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270829r1066976_rule
    title: Ubuntu 24.04 LTS must permit only authorized groups ownership of the audit
      log files.
    description: "Unauthorized disclosure of audit records can reveal system and configuration
      data to attackers, thus compromising its confidentiality. \n \nAudit information
      includes all information (e.g., audit records, audit settings, audit reports)
      needed to successfully audit operating system activity.\n\nSatisfies: SRG-OS-000057-GPOS-00027,
      SRG-OS-000058-GPOS-00028, SRG-OS-000059-GPOS-00029"
    imported_data:
      fixtext: |-
        Configure the audit log directory and its underlying files to be owned by "root" group.

        Set the "log_group" parameter of the audit configuration file to the "root" value so when a new log file is created, its group owner is properly set:

        $ sudo sed -i '/^log_group/D' /etc/audit/auditd.conf
        $ sudo sed -i /^log_file/a'log_group = root' /etc/audit/auditd.conf

        Signal the audit daemon to reload the configuration file to update the group owners of existing files:

        $ sudo systemctl kill auditd -s SIGHUP
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270830:def:1:
    controls:
      SRG-OS-000059-GPOS-00029: true
