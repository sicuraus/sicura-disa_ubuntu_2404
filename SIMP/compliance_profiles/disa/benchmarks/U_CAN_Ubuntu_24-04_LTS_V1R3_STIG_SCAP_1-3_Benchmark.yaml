      - CCI-004065
      - CCI-004066
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270726r1066667_rule
    title: Ubuntu 24.04 LTS must enforce password complexity by requiring that at
      least one uppercase character be used.
    description: "Use of a complex password helps to increase the time and resources
      required to compromise the password. Password complexity, or strength, is a
      measure of the effectiveness of a password in resisting attempts at guessing
      and brute-force attacks. \n \nPassword complexity is one factor of several that
      determines how long it takes to crack a password. The more complex the password,
      the greater the number of possible combinations that need to be tested before
      the password is compromised.\n\nSatisfies: SRG-OS-000069-GPOS-00037, SRG-OS-000730-GPOS-00190"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to enforce password complexity by requiring
        that at least one uppercase character be used. \n\nAdd or update the \"/etc/security/pwquality.conf\"
        file to contain the \"ucredit\" parameter: \n \nucredit=-1"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
