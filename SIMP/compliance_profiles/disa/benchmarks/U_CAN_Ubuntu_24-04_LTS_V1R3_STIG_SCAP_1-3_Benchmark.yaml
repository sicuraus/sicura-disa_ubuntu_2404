      - CCI-000766
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270721r1066652_rule
    title: Ubuntu 24.04 LTS must implement smart card logins for multifactor authentication
      for local and network access to privileged and nonprivileged accounts.
    description: "Without the use of multifactor authentication, the ease of access
      to privileged functions is greatly increased. \n \nMultifactor authentication
      requires using two or more factors to achieve authentication. \n \nFactors include:
      \ \n1) Something a user knows (e.g., password/PIN); \n2) Something a user has
      (e.g., cryptographic identification device, token); and \n3) Something a user
      is (e.g., biometric). \n \nA privileged account is defined as an information
      system account with authorizations of a privileged user. \n \nNetwork access
      is defined as access to an information system by a user (or a process acting
      on behalf of a user) communicating through a network (e.g., local area network,
      wide area network, or the internet). \n \nThe DOD common access card (CAC) with
      DOD-approved PKI is an example of multifactor authentication.\n\nSatisfies:
      SRG-OS-000105-GPOS-00052, SRG-OS-000107-GPOS-00054, SRG-OS-000106-GPOS-00053,
      SRG-OS-000108-GPOS-00055"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to use multifactor authentication for access
        to accounts. \n \nAdd or update \"pam_pkcs11.so\" in \"/etc/pam.d/common-auth\"
        to match the following line: \n \nauth    [success=2 default=ignore] pam_pkcs11.so"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
