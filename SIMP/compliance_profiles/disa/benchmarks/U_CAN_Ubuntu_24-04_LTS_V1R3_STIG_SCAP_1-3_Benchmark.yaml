    title: Ubuntu 24.04 LTS must restrict privilege elevation to authorized personnel.
    description: If the "sudoers" file is not configured correctly, any user defined
      on the system can initiate privileged actions on the target system.
    imported_data:
      fixtext: |-
        Configure the operating system to restrict privilege elevation to authorized personnel.

        Remove the following entries from the /etc/sudoers file or any configuration file under /etc/sudoers.d/:

        ALL     ALL=(ALL) ALL
        ALL     ALL=(ALL:ALL) ALL
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
