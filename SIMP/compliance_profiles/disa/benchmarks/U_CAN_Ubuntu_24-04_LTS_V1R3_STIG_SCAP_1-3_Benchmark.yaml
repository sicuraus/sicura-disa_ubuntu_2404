      needs of the organization, it would be difficult to establish, correlate, and
      investigate the events relating to an incident or identify those responsible
      for one. \n \nAudit records can be generated from various components within
      the information system (e.g., module or policy filter)."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to audit the execution of the module management
        program \"kmod\". \n \nAdd or update the following rule in the \"/etc/audit/rules.d/stig.rules\"
        file: \n \n-w /bin/kmod -p x -k modules \n  \nTo reload the rules file, issue
        the following command: \n \n$ sudo augenrules --load"
