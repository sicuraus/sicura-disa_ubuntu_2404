    title: Ubuntu 24.04 LTS when booted must require authentication upon booting into
      single-user and maintenance modes.
    description: "To mitigate the risk of unauthorized access to sensitive information
      by entities that have been issued certificates by DOD-approved PKIs, all DOD
      systems (e.g., web servers and web portals) must be properly configured to incorporate
      access control methods that do not rely solely on the possession of a certificate
      for access.  \n \nSuccessful authentication must not automatically give an entity
      access to an asset or security boundary. Authorization procedures and controls
      must be implemented to ensure each authenticated entity also has a validated
      and current authorization. Authorization is the process of determining whether
      an entity, once authenticated, is permitted to access a specific asset. Information
      systems use access control policies and enforcement mechanisms to implement
      this requirement. \n \nAccess control policies include identity-based policies,
      role-based policies, and attribute-based policies. Access enforcement mechanisms
      include access control lists, access control matrices, and cryptography. These
      policies and mechanisms must be employed by the application to control access
      between users (or processes acting on behalf of users) and objects (e.g., devices,
      files, records, processes, programs, and domains) in the information system."
    imported_data:
      fixtext: "Configure the system to require a password for authentication upon
        booting into single-user and maintenance modes. \n \nGenerate an encrypted
        (grub) password for root with the following command: \n \n$ grub-mkpasswd-pbkdf2
        \nEnter Password: \nReenter Password: \nPBKDF2 hash of your password is grub.pbkdf2.sha512.10000.MFU48934NJD84NF8NSD39993JDHF84NG
        \n \nUsing the hash from the output, modify the \"/etc/grub.d/40_custom\"
        file with the following command to add a boot password: \n \n$ sudo sed -i
        '$i set superusers=\\\"root\\\"\\npassword_pbkdf2 root <hash>' /etc/grub.d/40_custom
        \n \nwhere <hash> is the hash generated by grub-mkpasswd-pbkdf2 command. \n
        \nGenerate an updated \"grub.conf\" file with the new password by using the
        following command: \n \n$ sudo update-grub"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
