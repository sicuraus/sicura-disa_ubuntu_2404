    title: Ubuntu 24.04 LTS must have the "auditd" package installed.
    description: "Without establishing the when, where, type, source, and outcome
      of events that occurred, it would be difficult to establish, correlate, and
      investigate the events leading up to an outage or attack. \n \nWithout the capability
      to generate audit records, it would be difficult to establish, correlate, and
      investigate the events relating to an incident or identify those responsible
      for one. \n \nAudit record content that may be necessary to satisfy this requirement
      includes, for example, time stamps, source and destination addresses, user/process
      identifiers, event descriptions, success/fail indications, filenames involved,
      and access control or flow control rules invoked. \n \nReconstruction of harmful
      events or forensic analysis is not possible if audit records do not contain
      enough information. \n \nSuccessful incident response and auditing relies on
      timely, accurate system information and analysis to allow the organization to
      identify and respond to potential incidents in a proficient manner. If Ubuntu
      24.04 LTS does not provide the ability to centrally review Ubuntu 24.04 LTS
      logs, forensic analysis is negatively impacted. \n \nAssociating event types
      with detected events in Ubuntu 24.04 LTS audit logs provides a means of investigating
      an attack; recognizing resource utilization or capacity thresholds; or identifying
      an improperly configured operating system.\n\nSatisfies: SRG-OS-000365-GPOS-00152,
      SRG-OS-000337-GPOS-00129, SRG-OS-000062-GPOS-00031, SRG-OS-000475-GPOS-00220,
      SRG-OS-000042-GPOS-00020, SRG-OS-000042-GPOS-00021, SRG-OS-000037-GPOS-00015,
      SRG-OS-000038-GPOS-00016, SRG-OS-000039-GPOS-00017, SRG-OS-000040-GPOS-00018,
      SRG-OS-000041-GPOS-00019, SRG-OS-000051-GPOS-00024, SRG-OS-000054-GPOS-00025,
      SRG-OS-000122-GPOS-00063, SRG-OS-000348-GPOS-00136, SRG-OS-000349-GPOS-00137,
      SRG-OS-000350-GPOS-00138, SRG-OS-000351-GPOS-00139, SRG-OS-000352-GPOS-00140,
      SRG-OS-000353-GPOS-00141, SRG-OS-000354-GPOS-00142"
    imported_data:
      fixtext: "Configure the audit service to produce audit records containing the
        information needed to establish when (date and time) an event occurred. \n
        \nInstall the audit service (if the audit service is not already installed)
        with the following command: \n \n$ sudo apt install -y auditd"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
