    title: Ubuntu 24.04 LTS must automatically lock an account until the locked account
      is released by an administrator when three unsuccessful logon attempts have
      been made.
    description: |-
      By limiting the number of failed logon attempts, the risk of unauthorized system access via user password guessing, otherwise known as brute-forcing, is reduced. Limits are imposed by locking the account.

      Satisfies: SRG-OS-000021-GPOS-00005, SRG-OS-000329-GPOS-00128
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to utilize the \"pam_faillock\" module.
        \n\nEdit the /etc/pam.d/common-auth file to add the following lines below
        the \"auth\" definition for pam_unix.so:\nauth     [default=die]  pam_faillock.so
        authfail\nauth     sufficient     pam_faillock.so authsucc\n\nConfigure the
        \"pam_faillock\" module to use the following options:\n\nEdit the /etc/security/faillock.conf
        file and add/update the following keywords and values:\naudit\nsilent\ndeny
        = 3\nfail_interval = 900\nunlock_time = 0"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
