    title: Ubuntu 24.04 LTS must be configured so that audit log files are not read
      or write-accessible by unauthorized users.
    description: "Unauthorized disclosure of audit records can reveal system and configuration
      data to attackers, thus compromising its confidentiality. \n \nAudit information
      includes all information (e.g., audit records, audit settings, audit reports)
      needed to successfully audit operating system activity.\n\nSatisfies: SRG-OS-000057-GPOS-00027,
      SRG-OS-000058-GPOS-00028"
    imported_data:
      fixtext: "Configure the audit log files to have a mode of \"0600\" or less permissive.
        \n \nDetermine where the audit logs are stored with the following command:
        \n \n$ sudo grep -iw log_file /etc/audit/auditd.conf \n\nlog_file = /var/log/audit/audit.log
        \n \nUsing the path of the directory containing the audit logs, configure
        the audit log files to have a mode of \"0600\" or less permissive by using
        the following command: \n \n$ sudo chmod 0600 /var/log/audit/*"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
