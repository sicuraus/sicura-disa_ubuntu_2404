    title: Ubuntu 24.04 LTS must disable kernel core dumps.
    description: Kernel core dumps may contain the full contents of system memory
      at the time of the crash. Kernel core dumps may consume a considerable amount
      of disk space and may result in denial of service by exhausting the available
      space on the target file system partition.
    imported_data:
      fixtext: "If kernel core dumps are not required, disable the \"kdump-tools\"
        service with the following command: \n \n$ sudo systemctl disable kdump-tools.service\n
        \nIf kernel core dumps are required, document the need with the ISSO."
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270749:def:1:
