    title: Ubuntu 24.04 LTS SSH daemon must prevent remote hosts from connecting to
      the proxy display.
    description: When X11 forwarding is enabled, there may be additional exposure
      to the server and client displays if the sshd proxy display is configured to
      listen on the wildcard address. By default, sshd binds the forwarding server
      to the loopback address and sets the hostname part of the DISPLAY environment
      variable to localhost. This prevents remote hosts from connecting to the proxy
      display.
    imported_data:
      fixtext: "Configure the SSH daemon to prevent remote hosts from connecting to
        the proxy display. \n \nEdit the \"/etc/ssh/sshd_config\" file to uncomment
        or add the line for the \"X11UseLocalhost\" keyword and set its value to \"yes\"
        (this file may be named differently or be in a different location if using
        a version of SSH that is provided by a third-party vendor): \n \nX11UseLocalhost
        yes \n \nRestart the SSH daemon for the changes to take effect: \n \n$ sudo
        systemctl restart sshd.service"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
