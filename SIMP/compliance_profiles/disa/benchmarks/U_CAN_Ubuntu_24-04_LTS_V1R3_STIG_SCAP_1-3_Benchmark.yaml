    title: Ubuntu 24.04 LTS must generate audit records for all events that affect
      the systemd journal files.
    description: "Once an attacker establishes access to a system, the attacker often
      attempts to create a persistent method of reestablishing access. One way to
      accomplish this is for the attacker to modify system level binaries and their
      operation. Auditing the systemd journal files provides logging that can be used
      for forensic purposes.\n \nTo address access requirements, many operating systems
      may be integrated with enterprise-level authentication/access/auditing mechanisms
      that meet or exceed access control policy requirements."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to generate audit records for events that
        affect \"/var/log/journal\". \n \nAdd or update the following rule to \"/etc/audit/rules.d/stig.rules\":
        \n \n-w /var/log/journal -p wa -k systemd_journal \n  \nTo reload the rules
        file, issue the following command: \n \n$ sudo augenrules --load"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
