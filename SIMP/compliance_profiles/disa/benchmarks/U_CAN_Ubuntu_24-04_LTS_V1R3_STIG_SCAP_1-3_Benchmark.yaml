    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270730r1066679_rule
    title: Ubuntu 24.04 LTS must enforce 24 hours/1 day as the minimum password lifetime.
      Passwords for new users must have a 24 hours/1 day minimum password lifetime
      restriction.
    description: |-
      Enforcing a minimum password lifetime helps to prevent repeated password changes to defeat the password reuse or history enforcement requirement. If users are allowed to immediately and continually change their password, then the password could be repeatedly changed in a short period of time to defeat the organization's policy regarding password reuse.

      Satisfies: SRG-OS-000075-GPOS-00043, SRG-OS-000730-GPOS-00190
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to enforce a 24 hours/1 day minimum password
        lifetime. \n \nAdd or modify the following line in the \"/etc/login.defs\"
        file: \n \nPASS_MIN_DAYS    1"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270731:def:1:
    controls:
      SRG-OS-000076-GPOS-00044: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270731: true
      cci:CCI-004065: true
      IA-5(1): true
      cci:CCI-004066: true
    identifiers:
      disa:
      - SRG-OS-000076-GPOS-00044
      - V-270731
      - IA-5(1)
      - CCI-004065
      - CCI-004066
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270731r1066682_rule
    title: Ubuntu 24.04 LTS must enforce a 60-day maximum password lifetime restriction.
      Passwords for new users must have a 60-day maximum password lifetime restriction.
    description: |-
      Any password, no matter how complex, can eventually be cracked. Therefore, passwords need to be changed periodically. If Ubuntu 24.04 LTS does not limit the lifetime of passwords and force users to change their passwords, there is the risk that Ubuntu 24.04 LTS passwords could be compromised.

      Satisfies: SRG-OS-000076-GPOS-00044, SRG-OS-000730-GPOS-00190
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to enforce a 60-day maximum password lifetime.
        \n \nAdd or modify the following line in the \"/etc/login.defs\" file: \n
        \nPASS_MAX_DAYS    60"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
