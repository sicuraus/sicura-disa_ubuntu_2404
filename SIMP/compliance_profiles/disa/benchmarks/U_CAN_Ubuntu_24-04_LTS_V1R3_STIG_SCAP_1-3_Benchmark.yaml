    title: Ubuntu 24.04 LTS Advance Package Tool (APT) must be configured to prevent
      the installation of patches, service packs, device drivers, or Ubuntu 24.04
      LTS components without verification they have been digitally signed using a
      certificate that is recognized and approved by the organization.
    description: "Changes to any software components can have significant effects
      on the overall security of Ubuntu 24.04 LTS. This requirement ensures the software
      has not been tampered with and that it has been provided by a trusted vendor.
      \n \nAccordingly, patches, service packs, device drivers, or operating system
      components must be signed with a certificate recognized and approved by the
      organization. \n \nVerifying the authenticity of the software prior to installation
      validates the integrity of the patch or upgrade received from a vendor. This
      ensures the software has not been tampered with and that it has been provided
      by a trusted vendor. Self-signed certificates are disallowed by this requirement.
      Ubuntu 24.04 LTS will not have to verify the software again. This requirement
      does not mandate DOD certificates for this purpose; however, the certificate
      used to verify the software must be from an approved CA."
    imported_data:
      fixtext: "Configure APT to prevent the installation of patches, service packs,
        device drivers, or Ubuntu 24.04 LTS components without verification they have
        been digitally signed using a certificate recognized and approved by the organization.
        \n \nRemove/update any APT configuration files that contain the variable \"AllowUnauthenticated\"
        to \"false\" or remove \"AllowUnauthenticated\" entirely from each file. Below
        is an example of setting the \"AllowUnauthenticated\" variable to \"false\":
        \n \nAPT::Get::AllowUnauthenticated \"false\";"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270696:def:1:
