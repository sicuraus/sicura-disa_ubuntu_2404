    title: Ubuntu 24.04 LTS must notify designated personnel if baseline configurations
      are changed in an unauthorized manner. The file integrity tool must notify the
      system administrator (SA) when changes to the baseline configuration or anomalies
      in the operation of any security functions are discovered.
    description: "Unauthorized changes to the baseline configuration could make the
      system vulnerable to various attacks or allow unauthorized access to Ubuntu
      24.04 LTS. Changes to Ubuntu 24.04 LTS configurations can have unintended side
      effects, some of which may be relevant to security. \n \nDetecting such changes
      and providing an automated response can help avoid unintended, negative consequences
      that could ultimately affect the security state of Ubuntu 24.04 LTS. Ubuntu
      24.04 LTS' IMO/information system security officer (ISSO) and SAs must be notified
      via email and/or monitoring system trap when there is an unauthorized modification
      of a configuration item.\n\nSatisfies: SRG-OS-000447-GPOS-00201, SRG-OS-000363-GPOS-00150"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to notify designated personnel if baseline
        configurations are changed in an unauthorized manner. \n \nModify the \"SILENTREPORTS\"
        parameter in the \"/etc/default/aide\" file with a value of \"no\" if it does
        not already exist as follows:\n\nSILENTREPORTS=no"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
