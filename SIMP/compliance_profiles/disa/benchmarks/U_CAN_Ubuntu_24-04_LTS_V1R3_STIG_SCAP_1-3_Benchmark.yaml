    title: Ubuntu 24.04 LTS must generate audit records for any use of the setxattr,
      fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr system calls.
    description: "Without generating audit records specific to the security and mission
      needs of the organization, it would be difficult to establish, correlate, and
      investigate the events relating to an incident or identify those responsible
      for one. \n\nAudit records can be generated from various components within the
      information system (e.g., module or policy filter).\n\nThe system call rules
      are loaded into a matching engine that intercepts each syscall that all programs
      on the system makes. Therefore, it is very important to only use syscall rules
      when absolutely necessary since these affect performance. The more rules, the
      bigger the performance hit. The performance is helped, though, by combining
      syscalls into one rule whenever possible.\n\nSatisfies: SRG-OS-000064-GPOS-00033,
      SRG-OS-000462-GPOS-00206"
    imported_data:
      fixtext: "Configure the audit system to generate an audit event for any successful/unsuccessful
        use of the \"setxattr\", \"fsetxattr\", \"lsetxattr\", \"removexattr\", \"fremovexattr\",
        and \"lremovexattr\" system calls. \n \nAdd or update the following rules
        in the \"/etc/audit/rules.d/stig.rules\" file: \n \n-a always,exit -F arch=b32
        -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000
        -F auid!=-1 -k perm_mod \n-a always,exit -F arch=b32 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr
        -F auid=0 -k perm_mod  \n-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr
        -F auid>=1000 -F auid!=-1 -k perm_mod \n-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr
