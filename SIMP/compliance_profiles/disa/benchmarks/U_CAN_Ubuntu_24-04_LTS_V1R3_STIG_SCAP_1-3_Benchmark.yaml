    title: Ubuntu 24.04 LTS must encrypt all stored passwords with a FIPS 140-3 approved
      cryptographic hashing algorithm.
    description: Passwords need to be protected at all times, and encryption is the
      standard method for protecting passwords. If passwords are not encrypted, they
      can be plainly read (i.e., clear text) and easily compromised.
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to encrypt all stored passwords.  \n \nEdit/modify
        the following line in the \"/etc/login.defs\" file and set \"ENCRYPT_METHOD\"
        to SHA512: \n \nENCRYPT_METHOD SHA512"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270740:def:1:
    controls:
      SRG-OS-000392-GPOS-00172: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270740: true
      cci:CCI-002884: true
      MA-4(1): true
      cci:CCI-000172: true
      AU-12: true
    identifiers:
      disa:
      - SRG-OS-000392-GPOS-00172
      - V-270740
      - MA-4(1)
      - CCI-002884
      - AU-12
      - CCI-000172
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270740r1066709_rule
    title: Ubuntu 24.04 LTS must generate audit records for privileged activities,
      nonlocal maintenance, diagnostic sessions, and other system-level access.
    description: "If events associated with nonlocal administrative access or diagnostic
      sessions are not logged, a major tool for assessing and investigating attacks
      would not be available. \n \nThis requirement addresses auditing-related issues
      associated with maintenance tools used specifically for diagnostic and repair
      actions on organizational information systems. \n \nNonlocal maintenance and
      diagnostic activities are those activities conducted by individuals communicating
      through a network, either an external network (e.g., the internet) or an internal
      network. Local maintenance and diagnostic activities are those activities carried
      out by individuals physically present at the information system or information
      system component and not communicating across a network connection. \n \nThis
      requirement applies to hardware/software diagnostic test equipment or tools.
      This requirement does not cover hardware/software components that may support
      information system maintenance, yet are a part of the system, for example, the
      software implementing \"ping,\" \"ls,\" \"ipconfig,\" or the hardware and software
      implementing the monitoring port of an Ethernet switch.\n\nSatisfies: SRG-OS-000392-GPOS-00172,
      SRG-OS-000471-GPOS-00215"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to audit activities performed during nonlocal
        maintenance and diagnostic sessions. \n \nAdd or update the following rules
        in the \"/etc/audit/rules.d/stig.rules\" file: \n \n-w /var/log/sudo.log -p
        wa -k maintenance \n  \nTo reload the rules file, issue the following command:
        \n \n$ sudo augenrules --load"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270741:def:1:
    controls:
      SRG-OS-000125-GPOS-00065: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270741: true
      cci:CCI-000877: true
      MA-4: true
    identifiers:
      disa:
      - SRG-OS-000125-GPOS-00065
      - V-270741
      - MA-4
      - CCI-000877
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270741r1066712_rule
    title: Ubuntu 24.04 LTS must use strong authenticators in establishing nonlocal
      maintenance and diagnostic sessions.
    description: Nonlocal maintenance and diagnostic activities are those activities
      conducted by individuals communicating through a network, either an external
      network (e.g., the internet) or an internal network. Local maintenance and diagnostic
      activities are those activities carried out by individuals physically present
      at the information system or information system component and not communicating
      across a network connection. Typically, strong authentication requires authenticators
      that are resistant to replay attacks and employ multifactor authentication.
      Strong authenticators include, for example, PKI where certificates are stored
      on a token protected by a password, passphrase, or biometric.
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to use strong authentication when establishing
        nonlocal maintenance and diagnostic sessions.  \n \nAdd or modify the following
        line to /etc/ssh/sshd_config: \n \nUsePAM yes"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270742:def:1:
    controls:
      SRG-OS-000163-GPOS-00072: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270742: true
      cci:CCI-001133: true
      SC-10: true
    identifiers:
      disa:
      - SRG-OS-000163-GPOS-00072
      - V-270742
      - SC-10
      - CCI-001133
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270742r1066715_rule
    title: Ubuntu 24.04 LTS must immediately terminate all network connections associated
      with SSH traffic after a period of inactivity.
    description: "Automatic session termination addresses the termination of user-initiated
      logical sessions in contrast to the termination of network connections that
      are associated with communications sessions (i.e., network disconnect). A logical
      session (for local, network, and remote access) is initiated whenever a user
      (or process acting on behalf of a user) accesses an organizational information
      system. Such user sessions can be terminated (and thus terminate user access)
      without terminating network sessions. \n \nSession termination terminates all
      processes associated with a user's logical session except those processes that
      are specifically created by the user (i.e., session owner) to continue after
      the session is terminated. \n \nConditions or trigger events requiring automatic
      session termination can include, for example, organization-defined periods of
      user inactivity, targeted responses to certain types of incidents, and time-of-day
      restrictions on information system use. \n \nThis capability is typically reserved
      for specific Ubuntu 24.04 LTS functionality where the system owner, data owner,
      or organization requires additional assurance."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to automatically terminate inactive SSH
        sessions after a period of inactivity. \n \nModify or append the following
        line in the \"/etc/ssh/sshd_config\" file, replacing \"[Count]\" with a value
        of 1: \n \nClientAliveCountMax 1 \n \nRestart the SSH daemon for the changes
        to take effect: \n \n$ sudo systemctl restart ssh.service"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270743:def:1:
    controls:
      SRG-OS-000163-GPOS-00072: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270743: true
      cci:CCI-001133: true
      SC-10: true
    identifiers:
      disa:
      - SRG-OS-000163-GPOS-00072
      - V-270743
      - SC-10
      - CCI-001133
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270743r1066718_rule
    title: Ubuntu 24.04 LTS must immediately terminate all network connections associated
      with SSH traffic at the end of the session or after 10 minutes of inactivity.
    description: "Terminating an idle session within a short time period reduces the
      window of opportunity for unauthorized personnel to take control of a management
      session enabled on the console or console port that has been left unattended.
      In addition, quickly terminating an idle session will also free up resources
      committed by the managed network element.  \n \nTerminating network connections
      associated with communications sessions includes, for example, de-allocating
      associated TCP/IP address/port pairs at Ubuntu 24.04 LTS level, and de-allocating
      networking assignments at the application level if multiple application sessions
      are using a single operating system-level network connection. This does not
      mean that Ubuntu 24.04 LTS terminates all sessions or network access; it only
      ends the inactive session and releases the resources associated with that session."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to automatically terminate all network
        connections associated with SSH traffic at the end of a session or after a
        10-minute period of inactivity.\n\nIn the file /etc/ssh/sshd_config set ClientAliveInterval
        to a value of \"600\" or less: \n\nClientAliveInterval 600\n\nRestart the
        SSH daemon for the changes to take effect:\n\n$ sudo systemctl restart sshd.service"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
