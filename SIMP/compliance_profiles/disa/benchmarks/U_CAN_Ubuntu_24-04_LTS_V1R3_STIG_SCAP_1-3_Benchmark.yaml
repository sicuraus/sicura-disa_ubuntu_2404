    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270689r1066556_rule
    title: Ubuntu 24.04 LTS must prevent all software from executing at higher privilege
      levels than users executing the software and the audit system must be configured
      to audit the execution of privileged functions.
    description: "In certain situations, software applications/programs need to execute
      with elevated privileges to perform required functions. However, if the privileges
      required for execution are at a higher level than the privileges assigned to
      organizational users invoking such applications/programs, those users are indirectly
      provided with greater privileges than assigned by the organizations. \n \nSome
      programs and processes are required to operate at a higher privilege level and
      therefore, must be excluded from the organization-defined software list after
      review.\n\nSatisfies: SRG-OS-000326-GPOS-00126, SRG-OS-000327-GPOS-00127, SRG-OS-000755-GPOS-00220"
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to audit the execution of all privileged
        functions. \n \nAdd or update the following rules in the \"/etc/audit/rules.d/stig.rules\"
        file: \n \n-a always,exit -F arch=b64 -S execve -C uid!=euid -F euid=0 -F
        key=execpriv\n-a always,exit -F arch=b64 -S execve -C gid!=egid -F egid=0
        -F key=execpriv\n-a always,exit -F arch=b32 -S execve -C uid!=euid -F euid=0
        -F key=execpriv\n-a always,exit -F arch=b32 -S execve -C gid!=egid -F egid=0
        -F key=execpriv\n \nNotes: For 32-bit architectures, only the 32-bit specific
        entries are required. \n \nTo reload the rules file, issue the following command:
        \n \n$ sudo augenrules --load"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
