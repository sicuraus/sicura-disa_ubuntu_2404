    title: Ubuntu 24.04 LTS must be configured so that remote X connections are disabled,
      unless to fulfill documented and validated mission requirements.
    description: "The security risk of using X11 forwarding is that the client's X11
      display server may be exposed to attack when the SSH client requests forwarding.
      A system administrator (SA) must protect clients that may expose themselves
      to attack by unwittingly requesting X11 forwarding, which can warrant a ''no''
      setting. \n \nX11 forwarding must be enabled with caution. Users with the ability
      to bypass file permissions on the remote host (for the user's X11 authorization
      database) can access the local X11 display through the forwarded connection.
      An attacker may then be able to perform activities such as keystroke monitoring
      if the ForwardX11Trusted option is also enabled. \n \nIf X11 services are not
      required for the system's intended function, they must be disabled or restricted
      as appropriate to the system's needs."
    imported_data:
      fixtext: "Edit the \"/etc/ssh/sshd_config\" file to uncomment or add the line
        for the \"X11Forwarding\" keyword and set its value to \"no\" (this file may
        be named differently or be in a different location if using a version of SSH
        that is provided by a third-party vendor): \n \nX11Forwarding no \n \nRestart
        the SSH daemon for the changes to take effect: \n \n$ sudo systemctl restart
        sshd.service"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
