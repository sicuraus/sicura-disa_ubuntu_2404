    title: Ubuntu 24.04 LTS library files must have mode 0755 or less permissive.
    description: "If Ubuntu 24.04 LTS were to allow any user to make changes to software
      libraries, then those changes might be implemented without undergoing the appropriate
      testing and approvals that are part of a robust change management process. \n
      \nThis requirement applies to operating systems with software libraries that
      are accessible and configurable, as in the case of interpreted languages. Software
      libraries also include privileged programs that execute with escalated privileges.
      Only qualified and authorized individuals must be allowed to obtain access to
      information system components for purposes of initiating changes, including
      upgrades and modifications."
    imported_data:
      fixtext: |-
        Configure the systemwide shared library files contained in the directories "/lib", "/lib64", "/usr/lib", and "/usr/lib64" to have mode 0755 or less permissive with the following command:

        $ sudo find /lib /lib64 /usr/lib /usr/lib64 -type f -name '*.so*' -perm /022 -exec chmod go-w {} +
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
