    title: Ubuntu 24.04 LTS must have SSH installed.
    description: "Without protection of the transmitted information, confidentiality
      and integrity may be compromised because unprotected communications can be intercepted
      and either read or altered.  \n \nThis requirement applies to both internal
      and external networks and all types of information system components from which
      information can be transmitted (e.g., servers, mobile devices, notebook computers,
      printers, copiers, scanners, and facsimile machines). Communication paths outside
      the physical protection of a controlled boundary are exposed to the possibility
      of interception and modification.  \n \nProtecting the confidentiality and integrity
      of organizational information can be accomplished by physical means (e.g., employing
      physical distribution systems) or by logical means (e.g., employing cryptographic
      techniques). If physical means of protection are employed, then logical means
      (cryptography) do not have to be employed, and vice versa.\n\nSatisfies: SRG-OS-000423-GPOS-00187,
      SRG-OS-000425-GPOS-00189, SRG-OS-000426-GPOS-00190"
    imported_data:
      fixtext: "Install the \"ssh\" meta-package on the system with the following
        command: \n \n$ sudo apt install -y ssh"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
