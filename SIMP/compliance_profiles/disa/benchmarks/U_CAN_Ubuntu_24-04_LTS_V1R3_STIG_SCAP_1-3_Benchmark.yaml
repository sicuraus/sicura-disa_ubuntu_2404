      - V-270753
      - SC-5(2)
      - CCI-001095
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270753r1066748_rule
    title: Ubuntu 24.04 LTS must be configured to use TCP syncookies.
    description: "Denial of service (DoS) occurs when a resource is not available
      for legitimate users, resulting in the organization not being able to accomplish
      its mission or causing it to operate at degraded capacity.  \n \nManaging excess
      capacity ensures sufficient capacity is available to counter flooding attacks.
      Employing increased capacity and service redundancy may reduce the susceptibility
      to some DoS attacks. Managing excess capacity may include, for example, establishing
      selected usage priorities, quotas, or partitioning."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to use TCP syncookies with the following
        command: \n \n$ sudo sysctl -w net.ipv4.tcp_syncookies=1 \n \nIf \"1\" is
        not the system's default value, add or update the following line in \"/etc/sysctl.conf\":
        \n \nnet.ipv4.tcp_syncookies = 1"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270756:def:1:
    controls:
      SRG-OS-000205-GPOS-00083: true
      disa_cpe:Ubuntu24.04: true
      disa:Ubuntu24.04:v001.003:V-270756: true
      cci:CCI-001312: true
      SI-11: true
    identifiers:
      disa:
      - SRG-OS-000205-GPOS-00083
      - V-270756
      - SI-11
      - CCI-001312
    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270756r1134814_rule
    title: Ubuntu 24.04 LTS must generate error messages that provide information
      necessary for corrective actions without revealing information that could be
      exploited by adversaries.
    description: "Any operating system providing too much information in error messages
      risks compromising the data and security of the structure, and organizations
      must carefully consider the content and structure of error messages. \n \nThe
      extent to which information systems are able to identify and handle error conditions
      is guided by organizational policy and operational requirements. Information
      that could be exploited by adversaries includes, for example, erroneous logon
      attempts with passwords entered by mistake as the username, mission/business
      information that can be derived from (if not stated explicitly by) information
      recorded, and personal information, such as account numbers, Social Security
      numbers, and credit card numbers.\n\nThe /var/log/btmp, /var/log/wtmp, and /var/log/lastlog
      files have group write and global read permissions to allow for the lastlog
      function to perform. Limiting the permissions beyond this configuration will
      result in the failure of functions that rely on the lastlog database. Additionally,
      Canonical recommends excluding the history.log and eipp.log.xz from consideration
      in this check."
    imported_data:
      fixtext: |-
        Configure Ubuntu 24.04 LTS to set permissions of all log files under the /var/log directory to "640" or more restricted by using the following command:

        Note: The btmp, wtmp, lastlog, history, and eipp.log.xz files are excluded. Refer to the Discussion for details.

        $ sudo find /var/log -perm /137 ! -name '*[bw]tmp' ! -name '*lastlog' -type f -exec chmod 640 '{}' \;
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270757:def:1:
    controls:
