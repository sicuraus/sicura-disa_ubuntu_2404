      performance by overwhelming the audit log. Misconfigured audits may also make
      it more difficult to establish, correlate, and investigate the events relating
      to an incident or identify those responsible for one."
    imported_data:
      fixtext: "Configure /etc/audit/audit.rules, /etc/audit/rules.d/*, and /etc/audit/auditd.conf
        files to have a mode of \"0640\" by using the following command: \n \n$ sudo
