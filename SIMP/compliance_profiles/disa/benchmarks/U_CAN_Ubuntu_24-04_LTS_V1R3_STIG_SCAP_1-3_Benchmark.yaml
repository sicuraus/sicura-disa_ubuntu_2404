    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270692r1066565_rule
    title: Ubuntu 24.04 LTS must enable the graphical user logon banner to display
      the Standard Mandatory DOD Notice and Consent Banner before granting local access
      to the system via a graphical user logon.
    description: "Display of a standardized and approved use notification before granting
      access to Ubuntu 24.04 LTS ensures privacy and security notification verbiage
      used is consistent with applicable federal laws, Executive Orders, directives,
      policies, regulations, standards, and guidance. \n \nSystem use notifications
      are required only for access via logon interfaces with human users and are not
      required when such human interfaces do not exist. \n \nThe banner must be formatted
      in accordance with applicable DOD policy. Use the following verbiage for operating
      systems that can accommodate banners of 1300 characters: \n \n\"You are accessing
      a U.S. Government (USG) Information System (IS) that is provided for USG-authorized
      use only. \n \nBy using this IS (which includes any device attached to this
      IS), you consent to the following conditions: \n \n-The USG routinely intercepts
      and monitors communications on this IS for purposes including, but not limited
      to, penetration testing, COMSEC monitoring, network operations and defense,
      personnel misconduct (PM), law enforcement (LE), and counterintelligence (CI)
      investigations. \n \n-At any time, the USG may inspect and seize data stored
      on this IS. \n \n-Communications using, or data stored on, this IS are not private,
      are subject to routine monitoring, interception, and search, and may be disclosed
      or used for any USG-authorized purpose. \n \n-This IS includes security measures
      (e.g., authentication and access controls) to protect USG interests--not for
      your personal benefit or privacy. \n \n-Notwithstanding the above, using this
      IS does not constitute consent to PM, LE or CI investigative searching or monitoring
      of the content of privileged communications, or work product, related to personal
      representation or services by attorneys, psychotherapists, or clergy, and their
      assistants. Such communications and work product are private and confidential.
      See User Agreement for details.\" \n \nUse the following verbiage for operating
      systems that have severe limitations on the number of characters that can be
      displayed in the banner: \n \n\"I've read (literal ampersand) consent to terms
      in IS user agreem't.\""
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to display the Standard Mandatory DOD Notice
        and Consent Banner before granting access to Ubuntu 24.04 LTS via a graphical
        user logon.\n\nEdit the \"/etc/gdm3/greeter.dconf-defaults\" file. \n \nLook
        for the \"banner-message-enable\" parameter under the \"[org/gnome/login-screen]\"
        section and uncomment it (remove the leading \"#\" characters): \n[org/gnome/login-screen]
        \nbanner-message-enable=true \n \nUpdate the GDM with the new configuration:
        \n \n$ sudo dconf update \n$ sudo systemctl restart gdm3"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
