    oval-ids:
    - xccdf_mil.disa.stig_rule_SV-270680r1066529_rule
    title: Ubuntu 24.04 LTS must automatically terminate a user session after inactivity
      timeouts have expired.
    description: "Automatic session termination addresses the termination of user-initiated
      logical sessions in contrast to the termination of network connections associated
      with communications sessions (i.e., network disconnect). A logical session (for
      local, network, and remote access) is initiated whenever a user (or process
      acting on behalf of a user) accesses an organizational information system. Such
      user sessions can be terminated (and thus terminate user access) without terminating
      network sessions. \n \nSession termination terminates all processes associated
      with a user's logical session except those processes specifically created by
      the user (i.e., session owner) to continue after the session is terminated.
      \n \nConditions or trigger events requiring automatic session termination can
      include, for example, organization-defined periods of user inactivity, targeted
      responses to certain types of incidents, and time-of-day restrictions on information
      system use. \n \nThis capability is typically reserved for specific operating
      system functionality where the system owner, data owner, or organization requires
      additional assurance."
    imported_data:
      fixtext: "Configure Ubuntu 24.04 LTS to automatically terminate a user session
        after inactivity timeouts have expired or at shutdown. \n \nCreate the file
        \"/etc/profile.d/99-terminal_tmout.sh\" file if it does not exist. \n \nModify
        or append the following line in the \"/etc/profile.d/99-terminal_tmout.sh
        \" file: \n \nTMOUT=600 \n \nThis will set a timeout value of 10 minutes for
        all future sessions. \n \nTo set the timeout for the current sessions, execute
        the following command over the terminal session: \n \n$ export TMOUT=600"
    confine:
      os.release.major:
      - '24.04'
      os.name:
      - Ubuntu
  oval:sicura.disa.001.003.Ubuntu24.04.V-270681:def:1:
    controls:
      SRG-OS-000032-GPOS-00013: true
